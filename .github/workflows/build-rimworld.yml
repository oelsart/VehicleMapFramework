name: Build RimWorld Image
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    environment: Steam
    steps:
      - name: Build and push RimWorld image
        uses: RimWorks/steam-game-image-action@v4
        with:
          steam-username: ${{ secrets.STEAM_USERNAME }}
          steam-config-vdf: ${{ secrets.STEAM_CONFIG_VDF_B64 }}
          depotdownloader-account: ${{ secrets.DEPOTDOWNLOADER_ACCOUNT_CONFIG }}
          image: ghcr.io/${{ github.repository_owner }}/rimworld-game
          branch: unstable
          registry-password: ${{ secrets.GITHUB_TOKEN }}