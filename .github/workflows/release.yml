name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag Version'
        required: true
  push:
    tags:
      - 'v*'
    
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      Solution_Name: VehicleMapFramework
      Project_Path: Source/VehicleMapFramework/VehicleMapFramework.sln 
      WorkshopMods: |
        3014915404  # Vehicle Framework
        2023507013  # Vanilla Expanded Framework
        730936602   # Achtung!
        2890901044  # Combat Extended
        836308268   # Dubs Bad Hygiene
        1321849735  # Rimefeller

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    
    - name: Restore Dependencies
      run: dotnet restore ${{ env.Project_Path }}
      
    - name: Restore Cache
      id: cache-steam
      uses: actions/cache/restore@v4
      with:
        path: ~/Steam
        key: steamcmd-initial
        restore-keys: |
          steamcmd-
          
    - name: Install SteamCMD
      if: steps.cache-steam.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/Steam
        cd ~/Steam
        curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -

    - name: Download Workshop Mods
      run: |
        mkdir -p ~/Steam/steamapps/workshop/content/294100
        
        {
          echo "login anonymous"
          while IFS= read -r mod_id; do
          [[ -n "$mod_id" ]] && echo "workshop_download_item 294100 $mod_id validate"
          done <<< "${{ env.WorkshopMods }}"
          echo "quit"
        } > steam_script.txt
        
        ~/Steam/steamcmd.sh +runscript steam_script.txt
        
        echo "CI_SteamCMD_WorkShop=$HOME/Steam/steamapps/workshop/content/294100" >> $GITHUB_ENV
        ls -la ~/Steam/steamapps/workshop/content/294100

    - name: Build DLL
      run: |
        dotnet build ${{ env.Project_Path }} \
            --configuration Release \
            --no-restore \
            /p:SkipPostBuild=true \
            /p:SteamWorkshopRoot=${{ env.CI_SteamCMD_WorkShop }}
        
        zip -r VehicleMapFramework-${{ github.ref_name }}.zip \
            1.5 \
            1.6 \
            About \
            Common \
            LICENSE \
            LoadFolders.xml
        
        echo "RELEASE_ASSET=VehicleMapFramework-${{ github.ref_name }}.zip" >> $GITHUB_ENV
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref_name }} 
        name: "${{ github.ref_name }}"
        files: ${{ env.RELEASE_ASSET }}

    - name: Discord Notification
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
        title: 'Release: ${{ github.ref_name }}'
        username: LS & Co. (GitHub Division)
        url: "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"