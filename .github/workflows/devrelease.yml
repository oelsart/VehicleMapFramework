name: DevRelease

on:
  workflow_dispatch:
  push:
    tags:
      - 'dev-v*'

jobs:
  report_local_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Results
        run: |
          curl -L -o ./TestResults.xml "https://gist.githubusercontent.com/oelsart/3bb8183cedc9869f566440ca1553c633/raw/TestResults.xml"

      - name: Upload local test results artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalTestResults
          path: |
            ./TestResults.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        with:
          artifact: LocalTestResults
          name: Local Tests
          path: '*.xml'
          reporter: java-junit
          fail-on-error: 'true'
  
  build:
    runs-on: windows-latest
    needs: report_local_tests
    
    env:
      Solution_Name: VehicleMapFramework
      Project_Path: Source/VehicleMapFramework/VehicleMapFramework.sln
      WorkshopMods: |
        3522907382  # Vehicle Framework (Unstable)
        2023507013  # Vanilla Expanded Framework
        730936602   # Achtung!
        2890901044  # Combat Extended
        836308268   # Dubs Bad Hygiene
        1321849735  # Rimefeller
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Restore Cache
        id: cache-steam
        uses: actions/cache/restore@v5
        with:
          path: ./Steam
          key: steamcmd-initial
          restore-keys: |
            steamcmd-
          enableCrossOsArchive: true

      - name: Install SteamCMD
        if: steps.cache-steam.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "Steam"
          cd Steam
          Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile "steamcmd.zip"
          Expand-Archive -Path "steamcmd.zip" -DestinationPath "."
          Remove-Item "steamcmd.zip"

      - name: Download Workshop Mods
        shell: powershell
        run: |
          $modIds = @"
          ${{ env.WorkshopMods }}
          "@ -split "`n" | ForEach-Object { $_.Split('#')[0].Trim() } | Where-Object { $_ -ne "" }
          
          $scriptPath = "steam_script.txt"
          $commands = @("login anonymous")
          foreach ($id in $modIds) {
              $commands += "workshop_download_item 294100 $id validate"
          }
          $commands += "quit"
          $commands | Out-File -FilePath $scriptPath -Encoding ascii
          
          & "./Steam/steamcmd.exe" +runscript "../steam_script.txt"
          
          $LastExitCode = 0        
          if (Test-Path "Steam/steamapps/workshop/content/294100") {
              Write-Host "Workshop content verified."
          } else {
              exit 1
          }

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: |
          dotnet restore Source/VehicleMapFramework/VehicleMapFramework.csproj
          dotnet restore Source/VMF_AchtungPatch/VMF_AchtungPatch.csproj
          dotnet restore Source/VMF_CEPatch/VMF_CEPatch.csproj
          dotnet restore Source/VMF_DBHCompat/VMF_DBHCompat.csproj
          dotnet restore Source/VMF_RimefellerCompat/VMF_RimefellerCompat.csproj
          dotnet restore Source/VMF_VEFCompat/VMF_VEFCompat.csproj

      - name: Build DLL
        run: |
          $workshopRoot = "$pwd/Steam/steamapps/workshop/content/294100"
          dotnet build Source/VehicleMapFramework/VehicleMapFramework.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot /p:SkipPostBuild=true
          dotnet build Source/VMF_AchtungPatch/VMF_AchtungPatch.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
          dotnet build Source/VMF_CEPatch/VMF_CEPatch.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
          dotnet build Source/VMF_DBHCompat/VMF_DBHCompat.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
          dotnet build Source/VMF_RimefellerCompat/VMF_RimefellerCompat.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
          dotnet build Source/VMF_VEFCompat/VMF_VEFCompat.csproj --configuration Dev --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot

      - name: Move dev folder
        run: Move-Item ../VehicleMapFrameworkDev VehicleMapFrameworkDev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VehicleMapFrameworkDev
          path: |
            VehicleMapFrameworkDev/1.5
            VehicleMapFrameworkDev/1.6
            VehicleMapFrameworkDev/About
            VehicleMapFrameworkDev/Common
            VehicleMapFrameworkDev/LICENSE
            VehicleMapFrameworkDev/LoadFolders.xml
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: Steam
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: VehicleMapFrameworkDev
          path: VehicleMapFrameworkDev

      - name: Deploy
        uses: m00nl1ght-dev/steam-workshop-deploy@v4
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          path: VehicleMapFrameworkDev
          appId: 294100
          publishedFileId: 3528683767
          changeNote: ${{ github.ref_name }}

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
          title: 'Dev Update: ${{ github.ref_name }}'
          username: LS & Co. (GitHub Division)
          url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3528683767"