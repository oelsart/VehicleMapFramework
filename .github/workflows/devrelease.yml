name: DevRelease

on:
  workflow_dispatch:
  push:
    tags:
      - 'dev-v*'

jobs:
  build:
    runs-on: windows-latest
    
    env:
      Solution_Name: VehicleMapFramework
      Project_Path: Source/VehicleMapFramework/VehicleMapFramework.slnx
      WorkshopMods: |
        3522907382  # Vehicle Framework (Unstable)
        2023507013  # Vanilla Expanded Framework
        730936602   # Achtung!
        3495749827  # Combat Extended (Dev)
        836308268   # Dubs Bad Hygiene
        1321849735  # Rimefeller
      
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        
    - name: Restore Cache
      id: cache-steam
      uses: actions/cache/restore@v6
      with:
        path: ./Steam
        key: steamcmd-initial
        restore-keys: |
          steamcmd-
        enableCrossOsArchive: true
        
    - name: Install SteamCMD
      if: steps.cache-steam.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        New-Item -ItemType Directory -Force -Path "Steam"
        cd Steam
        Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile "steamcmd.zip"
        Expand-Archive -Path "steamcmd.zip" -DestinationPath "."
        Remove-Item "steamcmd.zip"
        
    - name: Download Workshop Mods
      shell: powershell
      run: |
        $modIds = @"
        ${{ env.WorkshopMods }}
        "@ -split "`n" | ForEach-Object { $_.Split('#')[0].Trim() } | Where-Object { $_ -ne "" }
        
        $scriptPath = "steam_script.txt"
        $commands = @("login anonymous")
        foreach ($id in $modIds) {
            $commands += "workshop_download_item 294100 $id validate"
        }
        $commands += "quit"
        $commands | Out-File -FilePath $scriptPath -Encoding ascii
        
        & "./Steam/steamcmd.exe" +runscript "../steam_script.txt"
        
        $LastExitCode = 0        
        if (Test-Path "Steam/steamapps/workshop/content/294100") {
            Write-Host "Workshop content verified."
        } else {
            exit 1
        }
    
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    
    - name: Restore Dependencies
      run: |
        dotnet restore Source/VehicleMapFramework/VehicleMapFramework.slnx
    
    - name: Build DLL
      run: |
        $workshopRoot = "$pwd/Steam/steamapps/workshop/content/294100"
        dotnet build Source/VehicleMapFramework/VehicleMapFramework.slnx -c DevRelease --no-restore /p:CIBuild=true /p:SteamWorkshopRoot=$workshopRoot
    
    - name: Move dev folder
      run: Move-Item ../VehicleMapFrameworkDev VehicleMapFrameworkDev
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: VehicleMapFrameworkDev
        path: |
          VehicleMapFrameworkDev/1.5
          VehicleMapFrameworkDev/1.6
          VehicleMapFrameworkDev/1.7
          VehicleMapFrameworkDev/About
          VehicleMapFrameworkDev/Common
          VehicleMapFrameworkDev/2022.3
          VehicleMapFrameworkDev/LICENSE
          VehicleMapFrameworkDev/LICENSE.VehicleFramework
          VehicleMapFrameworkDev/LoadFolders.xml
  
  
  test:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/${{ github.repository_owner }}/rimworld-game:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    env:
      RW_DIR: /game # コンテナ内のRimWorldインストールパスに合わせる
      WorkshopMods: |
        3522907382  # Vehicle Framework (Unstable)
        2023507013  # Vanilla Expanded Framework
        730936602   # Achtung!
        3495749827  # Combat Extended (Dev)
        836308268   # Dubs Bad Hygiene
        1321849735  # Rimefeller
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install .NET 10 & Xvfb
        run: |
          apt-get update && apt-get install -y xvfb curl
        # ※イメージ側に.NET 10 SDKが無い場合は actions/setup-dotnet@v6 を併用

      - name: Download Packaged Mod Artifact
        uses: actions/download-artifact@v8
        with:
          name: VehicleMapFrameworkDev
          path: ${{ env.RW_DIR }}/Mods/VehicleMapFrameworkDev

      # 既存のSteamCMDキャッシュ＆WorkshopModsダウンロード処理をここに配置し、
      # ダウンロード先を ${{ env.RW_DIR }}/Mods/ へシンボリックリンクまたはコピー[cite: 1, 2]

      - name: Build Test Runner Mod (DevTools + Test_NUnit)
        run: |
          dotnet build Source/Test_NUnit --configuration Release \
            /p:RimWorldDirectory=${{ env.RW_DIR }} \
            /p:SteamWorkshopRoot=${{ env.RW_DIR }}/Mods

      - name: Generate ModsConfig.xml
        run: |
          mkdir -p /tmp/rw_userdata/Config
          cat << 'EOF' > /tmp/rw_userdata/Config/ModsConfig.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ModsConfigData>
            <version>1.7.0</version>
            <activeMods>
              <li>ludeon.rimworld</li>
              <li>smashphil.devtools</li>
              <li>smashphil.vehicleframework</li>
              <li>oels.vehiclemapframework</li>
              <li>oels.vehiclemapframework.tests</li>
            </activeMods>
          </ModsConfigData>
          EOF

      - name: Run Real-Runtime Tests via DevTools
        run: |
          xvfb-run -a dotnet test Source/Test_NUnit --configuration Release --no-build \
            --logger "trx;LogFileName=integration_results.trx" \
            /p:RimWorldDirectory=${{ env.RW_DIR }} \
            /p:SaveDataFolder=/tmp/rw_userdata

      - name: Upload & Report Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Real Runtime Integration Tests
          path: "**/integration_results.trx"
          reporter: dotnet-trx
          fail-on-error: 'true'
    
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: Steam
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: VehicleMapFrameworkDev
        path: VehicleMapFrameworkDev
    
    - name: Disable Docker seccomp security profile (Fix SteamCMD network issue)
      run: |
        sudo mkdir -p /etc/docker
        echo '{"seccomp-profile": "unconfined"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
    
    - name: Deploy
      uses: m00nl1ght-dev/steam-workshop-deploy@v4
      with:
        username: ${{ secrets.STEAM_USERNAME }}          
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        path: VehicleMapFrameworkDev
        appId: 294100
        publishedFileId: 3528683767
        changeNote: ${{ github.ref_name }}

    - name: Discord Notification
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK_UPDATE }}
        title: 'Dev Update: ${{ github.ref_name }}'
        username: LS & Co. (GitHub Division)
        url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3528683767"