name: Build

on:
  push:
    branches: [ "build-test" ]

jobs:

  build:
    runs-on: ubuntu-latest
    
    env:
      Solution_Name: VehicleMapFramework
      Project_Path: Source/VehicleMapFramework/VehicleMapFramework.sln 
      WorkshopMods: |
        3014915404  # Vehicle Framework
        2023507013  # Vanilla Expanded Framework
        730936602   # Achtung!
        2890901044  # Combat Extended
        836308268   # Dubs Bad Hygiene
        1321849735  # Rimefeller

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # Execute all unit tests in the solution
    # - name: Execute unit tests
    #  run: dotnet test
    
    - name: Restore Dependencies
      run: dotnet restore ${{ env.Project_Path }}
        
    - name: Install SteamCMD
      run: |
        mkdir -p ~/Steam
        cd ~/Steam
        curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -
        echo "SteamCMD path: ~/Steam/steamcmd.sh"

    - name: Download Workshop Mods
      run: |
        mkdir -p ~/Steam/steamapps/workshop/content/294100
        while IFS= read -r mod_id; do
          if [ -n "$mod_id" ]; then
            echo "Downloading Workshop Mod: $mod_id"
            ~/Steam/steamcmd.sh +login anonymous +workshop_download_item 294100 $mod_id validate +quit
          fi
        done <<< "${{ env.WorkshopMods }}"
        echo "CI_SteamCMD_WorkShop=/root/Steam/steamapps/workshop/content/294100" >> $GITHUB_ENV
        ls -la ~/Steam/steamapps/workshop/content/294100

    - name: Build Mod DLL
      run: dotnet build ${{ env.Project_Path }} --configuration Release --no-restore /p:SkipPostBuild=true /p:SteamWorkshopRoot=${{ env.CI_SteamCMD_WorkShop }}
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VehicleMapFramework
        path: |
          1.5
          1.6
          About
          Common
          LICENSE
          LoadFolders.xml
