name: Build

on:
  push:
    branches: [ "1.6" ]

jobs:

  build:
    runs-on: windows-latest
    
    env:
      Solution_Name: VehicleMapFramework
      Test_Project_Path: Source/VehicleMapFramework/VehicleMapFramework.sln 

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    # Execute all unit tests in the solution
    # - name: Execute unit tests
    #  run: dotnet test
    
    - name: Restore Dependencies
      run: dotnet restore ${{ env.Test_Project_Path }}
      
    - name: Download Vehicle Framework Reference
      shell: powershell
      run: |
        $repo = "SmashPhil/Vehicle-Framework"
        
        # GitHub APIを使用して最新のRelease情報を取得
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest"
        
        # アセットのURLを検索 (Zipファイルなど、DLLを含むパッケージ)
        $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
        if (-not $asset) {
            Write-Error "Vehicle Framework のリリースアセットが見つかりませんでした。"
            exit 1
        }
        $downloadUrl = $asset.browser_download_url
        
        # ダウンロード先のフォルダを作成し、ダウンロード
        New-Item -ItemType Directory -Force -Path "..\..\..\..\..\..\workshop\content\294100"
        Invoke-WebRequest -Uri $downloadUrl -OutFile "..\..\..\..\..\..\workshop\content\294100\VehicleFramework.zip"
        
        Expand-Archive -Path "..\..\..\..\..\..\workshop\content\294100\VehicleFramework.zip" -DestinationPath ..\..\..\..\..\workshop\content\294100\3014915404"

    - name: Build Mod DLL
      run: dotnet build ${{ env.Test_Project_Path }} --configuration Release --no-restore

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          1.5
          1.6
          About
          Common
          LICENSE
          LoadFolders.xml
